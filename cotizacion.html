<style>
  :root{--tinta:#101418;--suave:#5d6773;--linea:#e3e7ee;--oro:#b8860b;--oroClaro:#f0b429}
  *{box-sizing:border-box}
  body{margin:0;background:#eef1f6;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);padding:24px 14px 60px}
  .hoja{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(16,20,24,.14);overflow:hidden}
  .cab{background:#0b0f17;color:#fff;padding:26px 30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .marca{font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.16em;font-size:19px;color:#fff}
  .marca span{color:var(--oroClaro)}
  .marca small{display:block;font-family:Inter,sans-serif;font-weight:400;letter-spacing:.04em;font-size:11px;color:#9aa7bd;margin-top:4px}
  .folio{text-align:right;font-size:12px;color:#9aa7bd;line-height:1.6}
  .folio b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#fff;letter-spacing:.04em}
  .cuerpo{padding:28px 30px 30px}
  .fila{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .bloque h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
  .bloque p{margin:0;font-size:14px;line-height:1.55}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);padding:10px 8px;border-bottom:1px solid var(--linea)}
  td{padding:11px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tot{margin-left:auto;width:280px;margin-top:14px}
  .tot div{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;color:var(--suave)}
  .tot .t{border-top:2px solid var(--tinta);margin-top:6px;padding-top:10px;color:var(--tinta);font-size:19px;font-weight:800}
  .nota{margin-top:22px;background:#fbf7ec;border:1px solid #efe0bd;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#6b5a2a}
  .cond{margin-top:16px;font-size:12.5px;color:var(--suave);line-height:1.7}
  .cond b{color:var(--tinta)}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .b{flex:1 1 200px;text-align:center;padding:13px 16px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;border:0;text-decoration:none;display:inline-block}
  .b--ok{background:#12b57a;color:#fff}
  .b--no{background:#fff;color:#8a1c1c;border:1.5px solid #f0c9c9}
  .b--pdf{background:#fff;color:var(--tinta);border:1.5px solid var(--linea)}
  .b--wa{background:#25d366;color:#04331a}
  .b[disabled]{opacity:.55;cursor:default}
  .pie{border-top:1px solid var(--linea);padding:18px 30px 22px;font-size:11.5px;color:var(--suave);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .pie b{color:var(--tinta)}
  .aviso-stado{display:inline-flex;align-items:center;gap:.4rem;background:#eef3ff;color:#274b9f;border:1px solid #c9d8fb;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:18px}
  .aviso-stado.ok{background:#eafaf3;color:#0e7a52;border-color:#b7ead3}
  .aviso-stado.no{background:#fdecec;color:#8a1c1c;border-color:#f4c7c7}
  .centro{max-width:560px;margin:60px auto;background:#fff;border-radius:16px;padding:34px;text-align:center;box-shadow:0 18px 50px rgba(16,20,24,.12)}
  .centro h1{font-size:19px;margin:0 0 8px}
  .centro p{color:var(--suave);font-size:14px;margin:0 0 18px}
  @media print{
    body{background:#fff;padding:0}
    .hoja{box-shadow:none;border-radius:0;max-width:none}
    .acciones{display:none}
  }
</style>
